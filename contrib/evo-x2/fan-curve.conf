# /etc/ec-su_axb35/fan-curve.conf
# Fan curves applied by ec-su_axb35-fan-curve.service (GMKtec EVO-X2).
#
# Each curve is five EC CPU temperatures in °C, one for each fan level
# 1-5 (20%, 40%, 60%, 80%, 100%). Once a second the driver:
#   - steps a fan up one level while temp >= RAMPUP of the next level
#   - steps it down one level while temp <= RAMPDOWN of its current level
# The driver rejects a curve unless RAMPUP strictly increases and
# RAMPDOWN[i] < RAMPUP[i].
#
# Fans never stop in curve mode: RAMPDOWN[1] = 0 means a fan never steps down
# from level 1, and the driver's curve_min_level=1 (default) never sets level 0.
#
# These curves reach 100% at 88 °C (fan1/fan2, CPU fans) and 85 °C (fan3,
# system fan). The BIOS smart-fan setting held all three at 80%.

FAN1_RAMPUP=50,60,70,80,88
FAN1_RAMPDOWN=0,55,65,75,84

FAN2_RAMPUP=50,60,70,80,88
FAN2_RAMPDOWN=0,55,65,75,84

FAN3_RAMPUP=45,55,65,75,85
FAN3_RAMPDOWN=0,50,60,70,80
